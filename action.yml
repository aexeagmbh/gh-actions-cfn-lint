---
name: cfn-lint
description: Lint CloudFormation templates with cfn-lint, with the cfn-lint-ax rules enabled

inputs:
  working-directory:
    description: The working directory where the commands are run
    required: false
    default: ./

runs:
  using: "composite"
  steps:
    - name: Setup virtualenv
      run: |
        echo "::group::Setup virtualenv"
        export CFN_LINT_VENV="${HOME}/.virtualenvs/cfn-lint"
        python -m venv "${CFN_LINT_VENV}"
        export PATH_TO_CFN_LINT="${CFN_LINT_VENV}/bin"
        echo "PATH_TO_CFN_LINT=${PATH_TO_CFN_LINT}" >> "$GITHUB_ENV"
        echo "::endgroup::"
      shell: bash
    - name: Install cfn-lint
      run: |
        echo "::group::Install cfn-lint"
        "${PATH_TO_CFN_LINT}/python" -m pip install --require-hashes -r "${GITHUB_ACTION_PATH}/requirements.txt"
        echo "::endgroup::"
      shell: bash
    - name: Print versions
      run: |
        echo "::group::Print versions"
        "${PATH_TO_CFN_LINT}/python" -m pip freeze
        echo "::endgroup::"
      shell: bash
    # The action enables the cfn-lint-ax rules itself: cfn-lint 1.59+ refuses
    # `append_rules` in a .cfnlintrc it finds on its own. The command-line value
    # replaces `append_rules` from config files.
    - name: Run cfn-lint
      run: |
        echo "::group::Run cfn-lint"
        "${PATH_TO_CFN_LINT}/cfn-lint" --append-rules cfn_lint_ax.rules cfn_lint_ax.serverless_rules
        echo "::endgroup::"
      shell: bash
      working-directory: ${{ inputs.working-directory }}
