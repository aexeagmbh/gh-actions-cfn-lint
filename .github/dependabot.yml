---
# Weekly updates of the packages the action installs and of the actions the
# tests use.
#
# requirements.txt is compiled from requirements.in by `uv pip compile` (the
# command is in its header), so Dependabot updates it like a lockfile,
# transitive packages included. `lockfile-only` keeps it within the ranges
# in requirements.in: by default Dependabot would rewrite them, raising each
# lower bound to the new version and moving an upper bound past it, which
# would undo the caps there. Each update runs through test.yml and merges by
# itself once that passes (dependabot-auto-merge.yml). Repositories using
# the action from @main get it with that merge.
#
# One group per ecosystem, so a week's updates arrive as one pull request.
# The 7-day cooldown leaves a broken release time to be yanked or fixed
# before it gets here; security updates skip it.
version: 2

updates:
  - package-ecosystem: uv   # requirements.in -> requirements.txt
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    versioning-strategy: lockfile-only
    allow:
      - dependency-type: all
    groups:
      python-packages:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - '*'
