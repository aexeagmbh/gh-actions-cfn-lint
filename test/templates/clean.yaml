---
# Passes cfn-lint and both cfn-lint-ax packs. The dead-letter queue's ARN is
# a parameter: a dead-letter queue in this template would need a
# RedrivePolicy of its own, as ES6000 only recognises one when the whole
# RedrivePolicy is an intrinsic function.
AWSTemplateFormatVersion: '2010-09-09'
Parameters:
  DeadLetterQueueArn:
    Type: String
Resources:
  Queue:
    Type: AWS::SQS::Queue
    Properties:
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !Ref DeadLetterQueueArn
        maxReceiveCount: 3
